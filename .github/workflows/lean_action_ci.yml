name: Lean Action CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

# A new run for a pull request cancels that pull request's superseded run. Push runs on `main`
# share `lean-ci-main` without `cancel-in-progress`: the active `main` run finishes and uploads the
# `.lake` and remote caches, while intermediate `main` pushes are replaced by the latest `main` tip
# while pending. Merge-queue groups and manual runs each use their own run id so all of them
# complete.
concurrency:
  group: >-
    lean-ci-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' ||
      github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CACHE_RECOVERY_GENERATION: ${{ vars.CACHE_RECOVERY_GENERATION || '0' }}
  COMPLEXITYLIB_CACHE_URLS: ${{ vars.COMPLEXITYLIB_CACHE_URLS }}
  DISABLE_CACHE_RESTORE: ${{ vars.DISABLE_CACHE_RESTORE }}
  LAKE_NO_CACHE: ${{ vars.DISABLE_CACHE_RESTORE == 'true' || vars.DISABLE_CACHE_RESTORE == '1' }}
  MATHLIB_NO_CACHE_ON_UPDATE: ${{ (vars.DISABLE_CACHE_RESTORE == 'true' || vars.DISABLE_CACHE_RESTORE == '1') && '1' || '0' }}

jobs:
  select-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lean: ${{ steps.select.outputs.lean }}
      origin: ${{ steps.select.outputs.origin }}
      tooling: ${{ steps.select.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          sparse-checkout: scripts/ci
      - id: select
        env:
          FORCE_FULL_CI: ${{ vars.FORCE_FULL_CI }}
        run: python3 -B scripts/ci/select_checks.py

  cache-origin-checks:
    needs: select-checks
    if: needs.select-checks.outputs.origin == 'true'
    name: HTTP cache origin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Test and vet the Linux origin
        working-directory: tools/cache-origin
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go test -run='^$' -fuzz=FuzzMapping -fuzztime=10s -parallel=2
          go build -o "$RUNNER_TEMP/cache-origin" .
      - name: Test dashboard snapshots and frontend
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_cache_dashboard.py'
          node --check tools/cache-origin/dashboard/app.js
          node scripts/test_cache_dashboard_frontend.cjs
      - name: Install nginx for loopback integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nginx apache2-utils
      - name: Test actual HTTPS publication, serving and GC
        env:
          CACHE_ORIGIN_NGINX_TEST: "1"
          CACHE_ORIGIN_BIN: ${{ runner.temp }}/cache-origin
          NGINX_BIN: /usr/sbin/nginx
        run: python3 -B -m unittest discover -s scripts -p 'test_cache_origin_nginx.py'

  source-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Includes the manual checker/builder controls in test_operator_manual.py. These source
      # checks need only Python: no research exports, publishing tools or Lean installation.
      - name: Test Python tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Operator manual links and excerpts
        run: python3 -B scripts/check_operator_manual.py
      - name: "Source hygiene"
        run: python3 -B scripts/check_hygiene.py --check-simp
      # `TimeM` annotations are unchecked, so all running-time bounds must use checked machine
      # models and `TimeM` is permanently forbidden (policy/statements.md#running-time-claims;
      # #7636, #6301). Sources only: no Lean.
      - name: "Forbid TimeM"
        run: python3 -B scripts/check_timem.py --report
      # A compound encoding that three or more public statements of a module spell out needs a
      # name (#1656). The existing ones are counted per module in
      # scripts/encoding_readability_baseline.json, which only falls. Pull requests enforce it in
      # the modules they change, against the first parent of the merge commit as in the
      # changed-file lints below; merge groups and pushes only report, so that queued PRs written
      # before an entry was lowered are not ejected. Sources only: no Lean.
      - name: "Encoding readability ratchet (changed modules)"
        if: github.event_name == 'pull_request'
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          BASE=${BASE:-$RECORDED_BASE}
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/check_encoding_readability.py --base "$BASE"
      - name: "Encoding readability report"
        if: github.event_name != 'pull_request'
        run: python3 -B scripts/check_encoding_readability.py --report
      # Positional projection chains such as `c.1.2` in public statements and definition bodies
      # (#1764) are counted per module in scripts/projection_chains_baseline.json. Pull requests
      # fail when a module they change has more chains than its entry or, unless they raise the
      # entry, than at the merge base; fewer chains need no baseline edit. Merge groups and
      # pushes only report. The base is the first parent of the merge commit, as above.
      # Sources only: no Lean.
      - name: "Projection chain ratchet (changed modules)"
        if: github.event_name == 'pull_request'
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          BASE=${BASE:-$RECORDED_BASE}
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/check_projection_chains.py --base "$BASE"
      - name: "Projection chain report"
        if: github.event_name != 'pull_request'
        run: python3 -B scripts/check_projection_chains.py --report
      # The API documentation (docbuild/) and the guide (guide/) are separate Lake projects that
      # share the library's toolchain and `.lake/packages`, so their lockfiles must follow the root
      # pins. Checking here makes a root cslib or Mathlib bump without matching lockfile updates
      # fail before Lean setup; the Guide workflow also compiles examples for library/pin changes.
      # This reads only checked-in files: no Lean, network or `.lake`.
      - name: "Documentation pins"
        run: python3 -B scripts/check_docs.py --config-only

  lean-checks:
    needs: select-checks
    if: needs.select-checks.outputs.lean == 'true'
    # Pushes to `main` run on the runner named by MAIN_BUILD_RUNNER when set, and merge groups run
    # on MERGE_GROUP_RUNNER when set; larger runners are billed even in public repositories. Pull
    # requests, manual runs, and events whose variable is unset always use the standard runner.
    # Delete either variable to return to `ubuntu-24.04` without a commit (scripts/cache/README.md).
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.MAIN_BUILD_RUNNER || github.event_name == 'merge_group' && vars.MERGE_GROUP_RUNNER || 'ubuntu-24.04' }}
    outputs:
      publication: ${{ steps.upload-publication.outputs.artifact-id }}
    permissions:
      contents: read
      # Each consumer reads only successful main merge-group build artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim unused hosted-runner SDK space
        continue-on-error: true
        env:
          SDK_CLEANUP_MIN_GIB: ${{ vars.SDK_CLEANUP_MIN_GIB }}
        run: scripts/ci/prepare-runner.sh
      - name: Sample runner disk use
        id: disk-sample
        continue-on-error: true
        run: python3 -B scripts/ci/runner_disk.py start
      # The steps below do what lean-action did, with bounded cache retries: install the toolchain,
      # restore and save `.lake` under the same Actions cache key, then build, test and lint.
      - name: Restore .lake from the Actions cache
        id: lake-cache
        if: vars.DISABLE_CACHE_RESTORE != 'true' && vars.DISABLE_CACHE_RESTORE != '1'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ env.CACHE_RECOVERY_GENERATION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ env.CACHE_RECOVERY_GENERATION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}
      # Restore elan and the toolchain from the Actions cache, or install them with retries
      # (.github/actions/install-lean, #1426). lean-action is not used: with every feature off it
      # only reinstalled elan from GitHub releases, without retries, so a release outage failed CI.
      - uses: ./.github/actions/install-lean
      - name: Restore Mathlib cache with retries
        if: vars.DISABLE_CACHE_RESTORE != 'true' && vars.DISABLE_CACHE_RESTORE != '1'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 -B scripts/cache/get_mathlib.py --lean-action
      # The source-check runner has no Lean installation and skips these real build tests.
      # Exercise compiler setup-input omissions, interrupt cleanup and publication staging on
      # pushes, manual runs and PR/queue diffs that can affect tooling or build configuration.
      - name: Test Lake build handoff reuse
        if: needs.select-checks.outputs.tooling == 'true'
        working-directory: scripts
        env:
          COMPLEXITYLIB_TEST_LAKE_HANDOFF: "1"
        run: >-
          python3 -B -m unittest
          test_cache_handoff.HandoffTests.test_real_lake_reuses_module_and_native_outputs_without_setup_inputs
      - name: Test real Lake interrupt cleanup
        if: needs.select-checks.outputs.tooling == 'true'
        run: >-
          python3 -B -m unittest
          scripts.test_check_cache_restores.RealLakeTests.test_parallel_real_lake_sigint_cleans_up_descendant_process_tree
          scripts.test_check_cache_restores.RealLakeTests.test_parallel_real_lake_sigterm_cleans_up_descendant_process_tree
      - name: Test real Lake cache publication staging
        if: needs.select-checks.outputs.tooling == 'true'
        run: python3 -B -m unittest scripts.test_cache_publish.RealLakePublicationTests
      # The `.lake` snapshot restored above and the remote cache below are published only when a
      # build of `main` completes, one at a time, so they lag the queue: merge groups have started
      # from snapshots 20 and 32 commits behind. Every commit that lands through the queue has a
      # build handoff from its own merge-group run, so a merge group first installs the handoff of
      # its nearest first-parent ancestor that has one, among at most 20 (scripts/cache/README.md).
      # It runs before the remote-cache step because it replaces `.lake/build` as a unit: the
      # remote cache then downloads only what the installed build still lacks, instead of outputs
      # that this step would replace. Only that ancestor's latest successful merge-group run of
      # this workflow is accepted, with the checks of the exact-revision step below, and its
      # toolchain, manifest and lakefile must equal this checkout's. Lake reuses an output only
      # where a module's input hash matches, so the build below still compiles everything the newer
      # commits and this group change. Pull requests never run this step. A miss is a workflow
      # warning and leaves the remote-cache step and the ordinary build unchanged; the variables
      # that disable the exact-revision step disable this one. It needs no cloud credential.
      # The script exits 0 after a restoration and after every miss, including a failed or timed-out
      # history fetch whose processes were confirmed stopped. It exits 125 only when that shutdown
      # could not be confirmed. `continue-on-error` would hide that from the steps below, which
      # run Git, the remote cache and the build, so this step records its exit status and the
      # next step fails the job on 125. Any other failure of this optional step, such as its
      # timeout, still lets the job continue.
      - name: Restore nearest ancestor merge-group build outputs
        id: ancestor-handoff
        if: >-
          github.event_name == 'merge_group' &&
          vars.DISABLE_CACHE_RESTORE != 'true' && vars.DISABLE_CACHE_RESTORE != '1' &&
          vars.DISABLE_BUILD_HANDOFF != '1' && vars.DISABLE_BUILD_HANDOFF != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          DISABLE_BUILD_HANDOFF: ${{ vars.DISABLE_BUILD_HANDOFF }}
        run: |
          status=0
          python3 -B scripts/cache_handoff.py restore --ancestor || status=$?
          echo "exit-status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Stop after an unconfirmed ancestor-handoff shutdown
        if: steps.ancestor-handoff.outputs.exit-status == '125'
        run: |
          echo "::error title=Unconfirmed cache process shutdown::The ancestor handoff's history fetch may still be running; rerun the job."
          exit 125
      # PR, merge-group and `main`-push handoff reads precede the remote-cache top-up because a
      # handoff replaces `.lake/build` as a unit. A PR uses only its merge commit's main parent.
      - name: Restore PR base merge-group build outputs
        id: pr-handoff
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'main' &&
          vars.DISABLE_CACHE_RESTORE != 'true' && vars.DISABLE_CACHE_RESTORE != '1' &&
          vars.DISABLE_BUILD_HANDOFF != 'true' && vars.DISABLE_BUILD_HANDOFF != '1' &&
          vars.DISABLE_PR_BUILD_HANDOFF != 'true' && vars.DISABLE_PR_BUILD_HANDOFF != '1'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          DISABLE_BUILD_HANDOFF: ${{ vars.DISABLE_BUILD_HANDOFF }}
          DISABLE_PR_BUILD_HANDOFF: ${{ vars.DISABLE_PR_BUILD_HANDOFF }}
          RESTORED_LAKE_KEY: ${{ steps.lake-cache.outputs.cache-matched-key }}
        run: python3 -B scripts/cache_handoff.py restore --pr-base
      # A merge-group build has already checked this exact commit before it lands on main.
      # Reuse its root outputs without granting merge groups access to the public-cache writer.
      # Missing, expired or mismatched handoffs leave the remote-cache top-up and ordinary build
      # below unchanged. Set DISABLE_BUILD_HANDOFF=1 to disable this handoff without a commit.
      - name: Restore validated merge-group build outputs
        id: main-handoff
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.DISABLE_CACHE_RESTORE != 'true' && vars.DISABLE_CACHE_RESTORE != '1' &&
          vars.DISABLE_BUILD_HANDOFF != '1' && vars.DISABLE_BUILD_HANDOFF != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          DISABLE_BUILD_HANDOFF: ${{ vars.DISABLE_BUILD_HANDOFF }}
        run: python3 -B scripts/cache_handoff.py restore
      # Download the outputs that `main` CI uploaded for the nearest uploaded ancestor of this
      # commit, skipping modules that `.lake` already has (scripts/cache/README.md). Skip when an
      # exact PR-base or exact `main`-revision handoff already installed the newest `main` build.
      - name: Restore build outputs from the remote cache
        if: >-
          vars.DISABLE_CACHE_RESTORE != 'true' && vars.DISABLE_CACHE_RESTORE != '1' &&
          steps.pr-handoff.outputs.restored != 'true' &&
          steps.main-handoff.outputs.restored != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/cache/get-missing.sh
      # Build the library, the `CslibFrontierTests` library test driver, and the Lean helper
      # executables in one Lake DAG so ready test modules backfill idle cores while long-pole
      # library stragglers finish. Pull requests, pushes and manual runs build every target, so
      # one run reports every error and warning.
      - name: "lake build"
        id: build
        if: github.event_name != 'merge_group'
        run: lake build --wfail --iofail @cslib-frontier CslibFrontierTests @/mk_all @/checkInitImports @mathlib/lint-style
      # A merge group builds the same targets with `--fail-fast`: after the first failed module
      # (an error, or a warning under `--wfail`), Lake lets running jobs finish but schedules no
      # new ones, and the step fails. Any failure ejects the group's entry, so building the rest
      # only delays the ejection and the rebuild of every group queued behind it. Later steps that
      # need the build accept the success of either build step.
      - name: "lake build (merge group, fail fast)"
        id: build-fail-fast
        if: github.event_name == 'merge_group'
        run: lake build --wfail --iofail --fail-fast @cslib-frontier CslibFrontierTests @/mk_all @/checkInitImports @mathlib/lint-style
      # On pull requests, lint only the affected library modules and their local importing clients
      # (#5163), falling back to whole-library `lake lint` on deletions/renames, config/linter edits,
      # ambiguous imports, or wide changes above quick_check.py's thresholds. Merge groups, pushes to
      # `main`, and manual runs always run whole-library `lake lint` so non-local linters (`simpNF`,
      # `simpComm`) check the combined `CslibFrontier` environment before changes land on `main`.
      - name: "lake lint (affected modules)"
        if: github.event_name == 'pull_request'
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          BASE=${BASE:-$RECORDED_BASE}
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/quick_check.py --lint-only --base "$BASE"
      - name: "lake lint"
        if: github.event_name != 'pull_request'
        run: lake lint
      # Advisory only: public definitions that a pull request adds or changes and that share a
      # large anonymized subterm with an existing definition, or only rename one (AGENTS.md, "New
      # statements and definitions"), and theorems it adds or changes whose statement the library
      # or a dependency already proves (#949). Run right after build and lint, and also upload a
      # small summary artifact (`lean-advisory-notices`), so reviewers can inspect these notices
      # before the remaining whole-library post-build checks finish and hand off to
      # `queue_pr.py --wait`. Candidates also go to the job summary and appear as notices; the step
      # never fails the job. See scripts/parallel_defs.py.
      - name: "Parallel-definition and duplicate-statement notices (advisory)"
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 10
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          SUMMARY_COPY="$RUNNER_TEMP/lean-advisory-notices.md"
          : > "$SUMMARY_COPY"
          record_incomplete() {
            printf '%s\n' "$1" >> "$SUMMARY_COPY"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            fi
            printf '%s\n' "$1"
          }
          status=0
          BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          BASE=${BASE:-$RECORDED_BASE}
          fetch_status=0
          git fetch --no-tags --depth=1 origin "$BASE" || fetch_status=$?
          if [ "$fetch_status" -ne 0 ]; then
            record_incomplete "$(printf '### Parallel-definition and duplicate-statement notices (incomplete)\n\n**Incomplete advisory check:** `git fetch` of comparison base `%s` failed (exit %s); neither duplication scan ran.\n' "$BASE" "$fetch_status")"
            exit "$fetch_status"
          fi
          defs_status=0
          python3 -B scripts/parallel_defs.py --base "$BASE" --github --no-build-check --summary-file "$SUMMARY_COPY" || defs_status=$?
          if [ "$defs_status" -ne 0 ]; then
            status=$defs_status
            record_incomplete "$(printf '\n**Incomplete advisory check:** `parallel_defs.py` exited with status %s.\n' "$defs_status")"
          fi
          thms_status=0
          python3 -B scripts/parallel_defs.py --theorems --base "$BASE" --github --no-build-check --summary-file "$SUMMARY_COPY" || thms_status=$?
          if [ "$thms_status" -ne 0 ]; then
            status=$thms_status
            record_incomplete "$(printf '\n**Incomplete advisory check:** `parallel_defs.py --theorems` exited with status %s.\n' "$thms_status")"
          fi
          exit "$status"
      - name: Upload early Lean advisory notices
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lean-advisory-notices
          path: ${{ runner.temp }}/lean-advisory-notices.md
          if-no-files-found: ignore
          retention-days: 2
      # Compiled-fixture unit tests for the post-build Python checkers. `source-checks` already runs
      # every non-Lean unit test on every event; this step runs the Lean-dependent fixture suites on
      # pushes, manual runs, and PR/queue diffs that can affect tooling or build configuration.
      - name: "Test post-build Python tooling"
        if: needs.select-checks.outputs.tooling == 'true'
        run: |
          set -e
          command -v lake
          command -v lean
          test -d .lake/packages
          python3 -B -m unittest scripts/test_check_tidy_surface.py
          python3 -B -m unittest scripts/test_check_security_premises.py
          python3 -B -m unittest scripts/test_check_reduction_witnesses.py
          python3 -B -m unittest scripts/test_check_hardness_assumptions.py
          python3 -B -m unittest scripts/test_parallel_defs.py
          python3 -B -m unittest scripts/test_check_init_imports.py
      # Source hygiene that needs the build outputs: each module's count of public statements that
      # mention tidy computability (#862) must equal its baseline; proofs may use it. See
      # scripts/check_tidy_surface.py.
      - name: "Tidy statement ratchet"
        run: |
          set -e
          python3 -B scripts/check_tidy_surface.py
      # Security theorems may not assume anything about objects their proofs construct, from the
      # adversary or not (AGENTS.md, "Security theorems"; #5293). scripts/check_security_premises.py
      # reads the built .olean files and compares the flagged premises with the known ones in
      # scripts/security_premises_baseline.json. It is an advisory search for the reviewer, not a
      # gate: pull requests print the differences in the modules they change, or in every module
      # when they change the checker or its baseline, with a notice, and pushes to `main` print
      # them all. A difference never fails the step; a scan that cannot run and a malformed
      # baseline do. The base is the first parent of the merge commit, as for the changed-file
      # lints below.
      - name: "Security premise report (changed modules)"
        if: github.event_name == 'pull_request'
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          BASE=${BASE:-$RECORDED_BASE}
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/check_security_premises.py --base "$BASE" --advisory
      - name: "Security premise report"
        if: github.event_name == 'push'
        continue-on-error: true
        run: python3 -B scripts/check_security_premises.py --report
      # Each explicit reduction needs an efficiency witness (AGENTS.md, "Security theorems";
      # #5293). scripts/check_reduction_witnesses.py reads the built .olean files, finds the
      # reductions that public theorems state advantage bounds with, and compares those without
      # an efficiency certificate with the known ones in scripts/reduction_witnesses_baseline.json.
      # It is advisory, with the scope, events and failure conditions of the security premise
      # report above.
      - name: "Reduction witness report (changed modules)"
        if: github.event_name == 'pull_request'
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          BASE=${BASE:-$RECORDED_BASE}
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/check_reduction_witnesses.py --base "$BASE" --advisory
      - name: "Reduction witness report"
        if: github.event_name == 'push'
        continue-on-error: true
        run: python3 -B scripts/check_reduction_witnesses.py --report
      # Named assumptions (AGENTS.md, "Security theorems"; #5578):
      # scripts/check_hardness_assumptions.py compares the assumptions that Crypto theorems take
      # with the inventory manual/programs-crypto-and-probability/assumptions.md and the gaps
      # recorded in scripts/hardness_assumptions_baseline.json. It checks the whole library, so,
      # like "Result registry references", it is enforced in merge groups as well as on pull
      # requests: two pull requests that each pass alone but conflict in meaning (both registering
      # one assumption, or one removing a row the other's theorem uses) fail their merge group, and
      # the queue ejects the later one instead of landing a break that would fail every open pull
      # request. Pushes to `main`, which can no longer be ejected, only report. The step runs after
      # an earlier check failed, so that one check's failure does not hide its output, but needs a
      # successful build (in a merge group, the fail-fast build).
      - name: "Named assumptions (whole library)"
        if: >-
          ${{ !cancelled() && github.event_name != 'push' &&
              (steps.build.outcome == 'success' || steps.build-fail-fast.outcome == 'success') }}
        run: |
          set -e
          python3 -B scripts/check_hardness_assumptions.py
      - name: "Named assumptions report"
        if: github.event_name == 'push'
        continue-on-error: true
        run: python3 -B scripts/check_hardness_assumptions.py --report
      - name: "Result registry references"
        run: python3 -B scripts/results_registry.py --compiled
      # Lints for the files a pull request adds or changes: names in module docstrings' "Main …"
      # lists exist, and a new test file does more than restate signatures. See
      # scripts/check_changed_files.py. The checkout is shallow, so the base commit is fetched
      # and compared directly. On pull requests, as in the parallel-definition step below, the
      # base is the first parent of the checked-out merge commit: `pull_request.base.sha` can be
      # an older tip of `main`, and comparing with it would lint files that later commits on `main`
      # changed. Merge-group runs keep `merge_group.base_sha`, which is always fetchable.
      - name: "Changed-file lints"
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -e
          BASE=
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          fi
          BASE=${BASE:-$RECORDED_BASE}
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/check_changed_files.py --base "$BASE"
      - name: "lake exe mk_all --check"
        run: |
          set -e
          lake exe mk_all --check
      - name: Test import generation with custom source directories
        if: needs.select-checks.outputs.tooling == 'true'
        run: |
          test -x .lake/build/bin/mk_all
          python3 -B -m unittest discover -s scripts -p 'test_mk_all.py'
      - name: "lake exe lint-style"
        run: |
          set -e
          lake exe lint-style
      - name: "checkInitImports"
        run: |
          set -e
          lake exe checkInitImports
      # Stage after every required Lean-side check. Source validation runs independently; the
      # required `ci-checks` aggregator below keeps a source-failing merge group from landing.
      - name: Stage merge-group build outputs
        id: cache-handoff
        if: >-
          github.event_name == 'merge_group' &&
          vars.DISABLE_BUILD_HANDOFF != '1' && vars.DISABLE_BUILD_HANDOFF != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          DISABLE_BUILD_HANDOFF: ${{ vars.DISABLE_BUILD_HANDOFF }}
        run: python3 -B scripts/cache_handoff.py pack --output "$RUNNER_TEMP/lean-handoff"
      - name: Upload merge-group build outputs
        if: github.event_name == 'merge_group' && steps.cache-handoff.outputs.artifact-name != ''
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.cache-handoff.outputs.artifact-name }}
          path: ${{ runner.temp }}/lean-handoff/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      # Stage once for every enabled publisher; compilation and archive creation stay here.
      - name: Stage cache publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.LAKE_CACHE_BUCKET != '' || vars.CACHE_SERVER_PUBLISH_ENABLED == 'true')
        run: python3 scripts/cache/publish.py stage "$RUNNER_TEMP/lake-publication"
      # Retain archives produced by staging alongside the validated build outputs. A later
      # check or staging failure still leaves reusable outputs, but never authorizes publication.
      # Cancellation before this point forfeits the snapshot; ordinary cache-save failures warn.
      - name: Save .lake to the Actions cache
        if: >-
          ${{ !cancelled() &&
              github.event_name == 'push' && github.ref == 'refs/heads/main' &&
              vars.DISABLE_CACHE_RESTORE != 'true' && vars.DISABLE_CACHE_RESTORE != '1' &&
              steps.lake-cache.outputs.cache-hit != 'true' &&
              steps.build.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      # Publishers consume this run's own package, never a PR/other-run artifact.
      - name: Hand off staged files to the enabled publishers
        id: upload-publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.LAKE_CACHE_BUCKET != '' || vars.CACHE_SERVER_PUBLISH_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lake-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lake-publication
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Report runner disk use
        if: >-
          !cancelled() && steps.ancestor-handoff.outputs.exit-status != '125' &&
          steps.disk-sample.outcome == 'success'
        continue-on-error: true
        run: python3 -B scripts/ci/runner_disk.py report
  # Keep the existing required-check context while source-only and Lean validation overlap. The
  # Lean job may prepare an unused publication artifact when source validation fails, but no
  # publisher consumes it unless this aggregator succeeds.
  ci-checks:
    needs: [select-checks, source-checks, lean-checks]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      publication: ${{ needs.lean-checks.outputs.publication }}
    steps:
      - name: Require source and Lean validation
        env:
          SELECTION_RESULT: ${{ needs.select-checks.result }}
          EXPECTED_LEAN: ${{ github.event_name == 'pull_request' && needs.select-checks.outputs.lean == 'false' && 'skipped' || 'success' }}
          SOURCE_RESULT: ${{ needs.source-checks.result }}
          LEAN_RESULT: ${{ needs.lean-checks.result }}
        run: |
          test "$SELECTION_RESULT" = success
          test "$SOURCE_RESULT" = success
          test "$LEAN_RESULT" = "$EXPECTED_LEAN"

  publish-gcs-cache:
    needs: ci-checks
    # No PR/merge-group job can mint an OIDC token. This job only consumes a successful
    # main-push run's exact staged publication, verified before cloud authentication.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.LAKE_CACHE_BUCKET != '' && needs.ci-checks.result == 'success' &&
      needs.ci-checks.outputs.publication != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ci-checks.outputs.publication }}
          merge-multiple: true
          path: ${{ runner.temp }}/lake-publication
      - name: Verify this run's publication
        run: python3 scripts/cache/publish.py verify "$RUNNER_TEMP/lake-publication" --revision "$GITHUB_SHA"
      - name: Authenticate to the remote cache
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.LAKE_CACHE_WIF_PROVIDER }}
          service_account: ${{ vars.LAKE_CACHE_SERVICE_ACCOUNT }}
      - name: Upload to the remote cache
        env:
          LAKE_CACHE_BUCKET: ${{ vars.LAKE_CACHE_BUCKET }}
        run: scripts/cache/upload.sh "$LAKE_CACHE_BUCKET" "$RUNNER_TEMP/lake-publication"

  publish-mit-cache:
    needs: [ci-checks, cache-origin-checks]
    # The package exists only after all validation gates passed. Publishers are independent.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' &&
          github.ref == 'refs/heads/main' && vars.CACHE_SERVER_PUBLISH_ENABLED == 'true' &&
          needs.ci-checks.result == 'success' &&
          needs.cache-origin-checks.result == 'success' &&
          needs.ci-checks.outputs.publication != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # MUST restrict this environment to the main branch before installing its upload password.
    environment: cache-server-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ci-checks.outputs.publication }}
          merge-multiple: true
          path: ${{ runner.temp }}/lake-publication
      - name: Verify this run's publication
        run: python3 scripts/cache/publish.py verify "$RUNNER_TEMP/lake-publication" --revision "$GITHUB_SHA"
      - name: Publish the package over HTTPS
        env:
          CACHE_SERVER_PASSWORD: ${{ secrets.CACHE_SERVER_PASSWORD }}
          CACHE_SERVER_USER: ${{ vars.CACHE_SERVER_USER }}
          CACHE_SERVER_URL: ${{ vars.CACHE_SERVER_URL }}
        run: >-
          python3 scripts/cache/publish.py http "$CACHE_SERVER_URL"
          "$RUNNER_TEMP/lake-publication"

  # Fast pull-request advisory job: surfaces source and PR-description notices in under a minute
  # (with a completed job summary, annotations and logs) instead of waiting for `source-checks`'s
  # Python test suite or the end of `lean-checks`. Non-blocking and excluded from `ci-checks`.
  pr-notices:
    if: github.event_name == 'pull_request'
    name: PR advisory notices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Advisory only: tactic blocks on lines a pull request adds or changes that repeat a block
      # of another proof in the same file or directory nearly verbatim (#3725).
      - name: "Repeated-proof-block notice (advisory)"
        continue-on-error: true
        timeout-minutes: 5
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          BASE=${BASE:-$RECORDED_BASE}
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/proof_copies.py --base "$BASE" --github
      # Advisory only: reports existing library modules modified by the pull request that have
      # high transitive fan-in (>= 500 importers across `CslibFrontier` and `CslibFrontierTests`).
      - name: "High-fan-in module impact (advisory)"
        continue-on-error: true
        timeout-minutes: 5
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          BASE=${BASE:-$RECORDED_BASE}
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/check_hub_impact.py --base "$BASE" --github
      # Advisory only: backticked Lean names in the PR description that the checked-out merge
      # commit does not declare (`--fetch-deps` shallow-fetches package and core sources only when
      # local sources leave unresolved tokens).
      - name: "PR description names (advisory)"
        continue-on-error: true
        timeout-minutes: 5
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          BASE=${BASE:-$RECORDED_BASE}
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 -B scripts/check_pr_names.py --event "$GITHUB_EVENT_PATH" --base "$BASE" --fetch-deps --github
