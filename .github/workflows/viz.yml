name: Codebase visualizations

on:
  pull_request:
    paths:
      - 'tools/viz/**'
      - '.github/workflows/viz.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  viz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The views replay the complete first-parent history.
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends graphviz ffmpeg
          python3 -m venv "$RUNNER_TEMP/viz-venv"
          "$RUNNER_TEMP/viz-venv/bin/pip" install -q -r tools/viz/requirements.txt
      - name: Test
        run: |
          "$RUNNER_TEMP/viz-venv/bin/python" -m unittest discover -s tools/viz -p 'test_*.py'
      - name: Build every view
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Videos are rendered nightly; here they would only add about ten minutes.
          "$RUNNER_TEMP/viz-venv/bin/python" tools/viz/build.py --fetch-prs --no-video \
            --prs-previous https://www.cslib.io/cslib-frontier/viz/prs.json
      - uses: actions/upload-artifact@v4
        with:
          name: codebase-visualizations
          path: tools/viz/_site
          if-no-files-found: error
